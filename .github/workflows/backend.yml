name: backend

# Checks only. Vercel deploys the backend project itself from GitHub.
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile every module
        run: python -m compileall -q app api
      - name: App starts and registers its routes
        run: python -c "from api.index import app; assert len(app.routes) > 10, 'routes missing'"
