name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile every module
        run: python -m compileall -q app
      - name: App starts and registers its routes
        run: python -c "from app.main import app; assert len(app.routes) > 10, 'routes missing'"

  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
    steps:
      - name: Trigger the host's deploy hook
        if: env.BACKEND_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$BACKEND_DEPLOY_HOOK"
      - name: Deploy hook not configured
        if: env.BACKEND_DEPLOY_HOOK == ''
        run: echo "::warning::Set the BACKEND_DEPLOY_HOOK secret to deploy the backend automatically."
